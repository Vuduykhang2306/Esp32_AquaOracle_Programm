name: Build

on:
  push:
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson OneWire DallasTemperature

      # arduino-cli wants the folder named after the main .ino.
      # secrets.example.h stands in for the real secrets.h.
      - name: Compile
        run: |
          mkdir -p sketch/Esp32_Program_AquaOracle
          cp *.ino sketch/Esp32_Program_AquaOracle/
          cp secrets.example.h sketch/Esp32_Program_AquaOracle/secrets.h
          arduino-cli compile --fqbn esp32:esp32:esp32 sketch/Esp32_Program_AquaOracle
